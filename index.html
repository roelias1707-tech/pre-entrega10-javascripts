<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Inventario - Pinturería</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Toastify CSS CDN -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <!-- Tus estilos personalizados -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <header class="text-center mb-4">
            <h1 class="fw-bold text-primary">🎨 Control de Stock - Pinturería</h1>
            <p class="text-muted">Pre-Entrega 10: APIs, Async/Await y Librerías</p>
        </header>

        <!-- Indicador de Carga / Feedback Visual -->
        <div id="contenedor-carga" class="text-center my-3">
            <p class="text-secondary fw-semibold">Cargando productos...</p>
        </div>

        <!-- Formulario para agregar productos (CRUD existente) -->
        <section class="card shadow-sm p-4 mb-4">
            <h3 class="h5 mb-3">Agregar Nuevo Producto</h3>
            <form id="form-producto" class="row g-3">
                <div class="col-md-4">
                    <input type="text" id="nombre-input" class="form-control" placeholder="Ej: Látex interior 4L" required>
                </div>
                <div class="col-md-3">
                    <input type="number" id="precio-input" class="form-control" placeholder="Ej: 12000" required>
                </div>
                <div class="col-md-3">
                    <input type="number" id="stock-input" class="form-control" placeholder="Ej: 10" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-success w-100">Agregar al Stock</button>
                </div>
            </form>
        </section>

        <!-- Listado de Productos -->
        <section>
            <h3 class="h5 mb-3">Inventario Actual</h3>
            <div id="lista-inventario" class="row g-3">
                <!-- Aquí se renderizan dinámicamente los productos -->
            </div>
        </section>
    </div>

    <!-- Toastify JS CDN -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <!-- Tu JavaScript principal -->
    <script src="./js/main.js"></script>
</body>
</html>
